<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="only light">
<title>Gutthann Board</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{color-scheme:only light}
body{background:#F3F3F1;color:#1C1C1A;font-family:'Hanken Grotesk',sans-serif;height:100vh;overflow:hidden}
input,button,textarea,select{font-family:'Hanken Grotesk',sans-serif;font-size:13px;color:#1C1C1A}
button{cursor:pointer;background:none;border:none}
*{scrollbar-width:thin;scrollbar-color:rgba(28,28,26,.25) transparent}
/* Redesign 10.08.: Dauer-Animationen (Blinken/Pulsieren) sind raus — Ruhe statt Unruhe.
   Agent-Aktivitaet zeigt ein statischer Ring an der Karte. */
#app{display:flex;height:100vh;overflow:hidden}

.sidebar{width:252px;flex:none;background:#FBFBFA;border-right:1px solid rgba(28,28,26,.10);display:flex;flex-direction:column;overflow-y:auto}
.brand{padding:18px 16px 14px;border-bottom:1px solid rgba(28,28,26,.08)}
.brand h1{font-family:'Space Grotesk',sans-serif;font-size:15px;font-weight:700}
.brand .sub{font-size:11.5px;color:#75756E;margin-top:3px;display:flex;align-items:center;gap:6px}
.brand .sub .dot{width:7px;height:7px;border-radius:50%;background:#7CA928}
.sect{padding:14px 10px 4px}
.sect .lbl{font-size:10.5px;letter-spacing:.09em;color:#8A8A83;font-weight:600;padding:0 8px 6px;text-transform:uppercase}
.row{display:flex;align-items:center;gap:8px;padding:7px 8px;border-radius:7px;cursor:pointer;font-size:13px;color:#33332F;user-select:none}
.row:hover{background:rgba(28,28,26,.05)}
.row.active{background:#E8DFC5;font-weight:600;color:#1C1C1A}
.row .pdot{width:10px;height:10px;border-radius:3px;flex:none}
.row .badge{margin-left:auto;background:#E29A2E;color:#231602;font-size:10.5px;font-weight:700;min-width:17px;height:17px;border-radius:9px;display:flex;align-items:center;justify-content:center;padding:0 5px}
.row .zahl{margin-left:auto;font-size:11px;font-weight:600;color:#75756E;background:rgba(28,28,26,.07);border-radius:9px;padding:1px 7px}
.row.active .zahl{background:rgba(28,28,26,.10)}
.row .pin{margin-left:auto;color:#9A9A93;font-size:12px;visibility:hidden;background:none}
.row:hover .pin{visibility:visible}
.row.addrow{color:#75756E}
.row.addrow:hover{color:#1C1C1A}

.main{flex:1;display:flex;flex-direction:column;min-width:0}
.topbar{padding:16px 22px 10px;display:flex;align-items:center;gap:12px;flex:none;flex-wrap:wrap}
.topbar h2{font-family:'Space Grotesk',sans-serif;font-size:21px;font-weight:700}
.topbar .scope{font-size:12px;color:#75756E}
.alertbtn{background:#E29A2E;color:#231602;font-size:12.5px;font-weight:600;padding:7px 14px;border-radius:18px;display:flex;align-items:center;gap:7px}
.callbtn{margin-left:auto;background:#1C1C1A;color:#F7F7F5;font-size:12.5px;font-weight:600;padding:7px 14px;border-radius:18px;white-space:nowrap}
.callbtn:hover{background:#33332F}.callbtn:disabled{opacity:.55;cursor:default}
/* Glocke (Migration 113): Ereignisse, die mich betreffen — Erwaehnung, Zuweisung,
   Kommentar, Aenderung. Der Zaehler zeigt nur Ungelesenes; gelesene Zeilen bleiben
   ausgegraut stehen, damit niemand suchen muss, was er gerade weggeklickt hat. */
.bellbtn{position:relative;background:rgba(28,28,26,.06);border-radius:18px;padding:7px 12px;font-size:14px;line-height:1}
.bellbtn:hover{background:rgba(28,28,26,.12)}
.bellbtn .cnt{position:absolute;top:-4px;right:-4px;background:#E29A2E;color:#231602;font-size:10px;font-weight:700;min-width:16px;height:16px;border-radius:8px;display:flex;align-items:center;justify-content:center;padding:0 4px}
.bellpanel{position:fixed;z-index:60;width:392px;max-height:min(70vh,560px);overflow-y:auto;background:#FBFBFA;border:1px solid rgba(28,28,26,.12);border-radius:14px;box-shadow:0 14px 40px rgba(28,28,26,.18);padding:6px}
.bellpanel .bkopf{display:flex;align-items:center;gap:8px;padding:9px 10px 8px}
.bellpanel .bkopf b{font-family:'Space Grotesk',sans-serif;font-size:13.5px}
.bellpanel .balle{margin-left:auto;font-size:11.5px;color:#75756E}
.bellpanel .balle:hover{color:#1C1C1A;text-decoration:underline}
.bmeld{display:flex;gap:9px;padding:9px 10px;border-radius:9px;cursor:pointer;align-items:flex-start}
.bmeld:hover{background:rgba(28,28,26,.05)}
.bmeld.gelesen{opacity:.48}
.bmeld .bico{flex:none;width:17px;text-align:center;font-size:12.5px;line-height:1.4}
.bmeld .btxt{min-width:0;font-size:12.5px;line-height:1.4}
.bmeld .btxt .bwas{overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.bmeld .btitel{font-size:11.5px;color:#75756E;margin-top:2px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bmeld .bzeit{margin-left:auto;flex:none;font-size:11px;color:#9A9A93;padding-left:6px}
.bleer{padding:12px 12px 18px;font-size:12.5px;color:#8A8A83;line-height:1.5}
/* "Agent schreibt..." unter den Kommentaren -- ohne das wirkt ein Zuruf, als waere
   er ins Leere gegangen. Bewusst KEINE Dauer-Animation (Redesign 10.08.: Ruhe statt
   Unruhe); die Punkte pulsieren nur dezent und stehen bei reduzierter Bewegung still. */
.agenttippt{display:flex;align-items:center;gap:8px;padding:8px 2px 4px;font-size:12.5px;color:#75756E}
.agenttippt .punkte{letter-spacing:2px;color:#7CA928;animation:tippt 1.4s ease-in-out infinite}
@keyframes tippt{0%,100%{opacity:.35}50%{opacity:1}}
@media (prefers-reduced-motion:reduce){.agenttippt .punkte{animation:none;opacity:.7}}
/* Vorschlag mit Klick-Bestaetigung (Migration 115/116) — eine Frist AENDERT eine
   bestehende Eigenschaft der Karte, darum wirkt sie nie sofort. Sandfarbe wie die
   Zielbild-/Zuarbeit-Chips, damit "hier entscheidest du" optisch konsistent bleibt. */
.vorschlagzeile{display:flex;align-items:center;gap:9px;margin-top:8px;padding:7px 11px;border-radius:9px;background:#E8DFC5;font-size:12.5px}
.vorschlagzeile.entschieden{background:transparent;border:1px solid rgba(28,28,26,.10);color:#75756E}
.vorschlagzeile button:disabled{opacity:.5;cursor:default}
/* @-Vorschlag im Kommentarfeld — ohne ihn kennt niemand die Kuerzel. */
.mention{position:fixed;z-index:70;background:#FBFBFA;border:1px solid rgba(28,28,26,.12);border-radius:10px;box-shadow:0 10px 28px rgba(28,28,26,.16);padding:4px;min-width:196px}
.mention button{display:block;width:100%;text-align:left;padding:6px 9px;border-radius:6px;font-size:12.5px;white-space:nowrap}
.mention button:hover,.mention button.an{background:#E8DFC5}
.mention button small{color:#8A8A83;margin-left:6px}
.boardwrap{flex:1;overflow-x:auto;overflow-y:hidden;padding:12px 28px 24px;display:flex;gap:20px;align-items:flex-start}
.col{width:392px;flex:none;display:flex;flex-direction:column;background:rgba(28,28,26,.055);border:none;border-radius:16px;max-height:100%;transition:background .16s ease,box-shadow .16s ease}
/* Spaltengruppen (Migration 119): Spalten mit gleichem Band stehen als ein Block unter
   einer Ueberschrift — im VgV-Radar die Phasen. Zwischen zwei Baendern ist der Abstand
   groesser als zwischen den Spalten eines Bandes; das ist die eigentliche Abtrennung. */
.phase{flex:none;display:flex;flex-direction:column;gap:8px;height:100%;min-height:0;position:relative}
.phase+.phase{margin-left:48px}
.phase+.phase::before{content:'';position:absolute;left:-24px;top:0;bottom:0;width:1px;background:rgba(28,28,26,.18)}
.phasehead{flex:none;display:flex;align-items:center;gap:9px;padding:0 4px 0 8px}
.phasehead .pname{font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:#75756E;white-space:nowrap}
.phasehead .pcnt{font-size:11px;font-weight:600;color:#8A8A83;background:rgba(28,28,26,.06);border-radius:10px;padding:1px 8px}
.phasehead .pline{flex:1;height:1px;background:rgba(28,28,26,.13)}
.phasecols{flex:1;min-height:0;display:flex;gap:14px;align-items:flex-start}
.col.dragover{background:rgba(163,213,66,.16);box-shadow:inset 0 0 0 2px rgba(124,169,40,.55)}
.colhead{padding:14px 14px 10px 16px;display:flex;align-items:center;gap:7px;flex:none}
.colhead .name{font-size:13px;font-weight:600;letter-spacing:.01em}
.colhead .cnt{font-size:11.5px;font-weight:600;color:#75756E;background:rgba(28,28,26,.06);border-radius:10px;padding:1px 8px}
.colhead .roledot{width:7px;height:7px;border-radius:50%;background:#A3D542}
.colhead .menu{margin-left:auto;color:#8A8A83;padding:2px 6px;border-radius:5px;opacity:0;transition:opacity .12s ease}
.col:hover .colhead .menu{opacity:1}
.colhead .menu:hover{background:rgba(28,28,26,.07)}
.colhead .autochip{font-size:10px;font-weight:700;padding:2px 7px;border-radius:9px;background:#E8F5C4;color:#3E5312;cursor:pointer;white-space:nowrap}
.colhead .autochip:hover{background:#DCEFA8}
.cards{overflow-y:auto;padding:6px 10px;display:flex;flex-direction:column;gap:10px;min-height:30px}
.altbtn{align-self:flex-start;font-size:11.5px;font-weight:600;color:#8A8A83;padding:5px 9px;border-radius:9px}
.altbtn:hover{color:#3C3C38;background:rgba(28,28,26,.06)}
.card{background:#FFFFFF;border:1px solid rgba(28,28,26,.11);border-radius:12px;padding:12px 14px;cursor:pointer;box-shadow:0 1px 2px rgba(28,28,26,.07),0 3px 10px rgba(28,28,26,.07);transition:box-shadow .15s ease,transform .15s ease,border-color .15s ease}
.card:hover{border-color:rgba(28,28,26,.20);box-shadow:0 6px 18px rgba(28,28,26,.13);transform:translateY(-1px)}
.card.aura{box-shadow:0 0 0 2px rgba(163,213,66,.45),0 2px 8px rgba(28,28,26,.05)}
.card.rf{background:#FBF3E2;box-shadow:0 0 0 1.5px #E29A2E,0 2px 8px rgba(28,28,26,.05)}
.card .chip{display:inline-flex;align-items:center;gap:5px;font-size:10.5px;font-weight:600;padding:2px 8px;border-radius:9px;margin-bottom:6px}
.card .chip .cdot{width:6px;height:6px;border-radius:50%}
.card .t{font-size:15px;font-weight:600;line-height:1.38;letter-spacing:-.01em;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.card .meta{display:flex;align-items:center;gap:8px;margin-top:8px;font-size:12px;color:#75756E;flex-wrap:nowrap;overflow:hidden;min-width:0}
.card .meta>span{flex:none}
.card .meta .due.urgent{color:#A66A12;font-weight:600}
.card .meta .proj{margin-left:auto;font-weight:600;flex:0 1 auto;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.card .vgvrow{display:flex;align-items:center;gap:7px;margin-top:7px;flex-wrap:nowrap;overflow:hidden}
.card .vchip{font-size:10.5px;font-weight:700;letter-spacing:.03em;padding:2px 9px;border-radius:9px}
.card .pchip{font-size:10px;font-weight:600;padding:1px 7px;border-radius:8px;background:rgba(28,28,26,.07);color:#4F4F49}
.card .vfrist{display:inline-flex;align-items:center;gap:5px;font-size:11.5px;color:#75756E;white-space:nowrap}
.card .vfrist.a-rot{color:#A8341C;font-weight:700}
.card .vfrist.a-orange{color:#8A5606;font-weight:600}
.card .vfrist.a-gruen{color:#4A6B32}
.card .vfrist.a-vorbei{color:#9A9A93}
.vgvban{border-radius:10px;padding:10px 14px;margin-bottom:10px}
.vgvkv{display:grid;grid-template-columns:auto 1fr;gap:3px 14px;font-size:12.5px}
.vgvkv .k{color:#75756E;white-space:nowrap}
.vgvkv .w{color:#1C1C1A}
.vgvdat{max-height:180px;overflow:auto;background:#F6F6F3;border-radius:9px;padding:8px 12px;font-size:12px;line-height:1.7;color:#3C3C38}
a.vgvlnk{text-decoration:none;display:inline-flex;align-items:center;font-size:12px;padding:5px 11px}
.dashbtn{background:#E8DFC5;color:#1C1C1A;font-size:12.5px;font-weight:600;padding:7px 14px;border-radius:18px;white-space:nowrap}
.dashbtn:hover{background:#DFD2AC}
.dashbox{width:96vw;max-width:1620px;height:92vh;display:flex;flex-direction:column;background:#FCFCFB;border-radius:16px;box-shadow:0 18px 48px rgba(28,28,26,.28);padding:18px 24px}
.dashbox .scope{font-size:12px;color:#75756E}
.dkopf{display:flex;align-items:baseline;gap:14px;margin-bottom:14px;flex:none}
.dkopf h2{font-family:'Space Grotesk',sans-serif;font-size:19px;font-weight:700}
.dclose{margin-left:auto;font-size:17px;color:#75756E;padding:2px 8px}
.dgrid{flex:1;min-height:0;display:grid;grid-template-columns:minmax(0,58fr) minmax(0,42fr);gap:0 26px}
.dgrid.gleich{grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:0 30px}
.dcol{min-height:0;overflow-y:auto;padding-right:6px}
@media(max-width:1020px){.dashbox{height:auto;max-height:92vh;overflow-y:auto}.dgrid{display:block}}
.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:20px}
.kpi{background:#fff;border:1px solid rgba(28,28,26,.09);border-radius:12px;padding:11px 14px 9px}
.kpi .w{font-family:'Space Grotesk',sans-serif;font-size:21px;font-weight:700;line-height:1.1}
.kpi.warn .w{color:#B4540A}
.kpi .l{font-size:10px;letter-spacing:.07em;color:#8A8A83;font-weight:700;text-transform:uppercase;margin-top:3px}
.kpi .s{font-size:11px;color:#75756E;margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dlane{margin-bottom:22px}
.dlane .slbl{font-size:10.5px;letter-spacing:.08em;color:#8A8A83;font-weight:700;text-transform:uppercase;margin-bottom:9px}
.dleer{font-size:12.5px;color:#75756E;background:#F6F6F3;border-radius:9px;padding:10px 14px}
.drow{display:grid;grid-template-columns:250px 1fr;gap:12px;align-items:center;margin-bottom:7px}
.dlbl{font-size:12.5px;line-height:1.3;overflow:hidden}
.dlbl b{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;font-weight:600;line-height:1.3}
.dlbl .dsub{font-size:11px;color:#8A8A83}
.dtrack{position:relative;height:22px;background:#EFEFEB;border-radius:6px}
.dtrack.kopf{background:none;height:14px}
.dtick{position:absolute;top:0;font-size:10px;color:#9A9A93;transform:translateX(-50%)}
.dbar{position:absolute;left:0;top:6px;height:10px;border-radius:5px;background:#C9DFA0}
.dbar.knapp{background:#F3D9A8}.dbar.rot{background:#EFB9A8}.dbar.vorbei{background:#DDDDD7}
.ddot{position:absolute;top:5px;width:12px;height:12px;border-radius:50%;background:#5FA132;transform:translateX(-50%);border:2px solid #FCFCFB}
.ddot.knapp{background:#D08427}.ddot.rot{background:#C2543D}.ddot.vorbei{background:#9A9A93}
.dend{position:absolute;top:3px;font-size:11px;font-weight:700;color:#3C5D1E;transform:translateX(10px);white-space:nowrap}
.dend.knapp{color:#8A5606}.dend.rot{color:#B4432E}.dend.vorbei{color:#8A8A83}
.dtabs{display:flex;gap:3px;background:#EFEFEB;border-radius:20px;padding:3px}
.dtab{font-size:12.5px;font-weight:600;color:#75756E;padding:6px 14px;border-radius:17px;display:flex;align-items:center;gap:7px;white-space:nowrap}
.dtab:hover{color:#1C1C1A}
.dtab.an{background:#FCFCFB;color:#1C1C1A;box-shadow:0 1px 3px rgba(28,28,26,.12)}
.dtab .n{font-size:11px;font-weight:700;color:#8A8A83;background:#E4E4DE;border-radius:8px;padding:0 6px}
.dtab.an .n{background:#E8DFC5;color:#3C3C38}
.vgrp{font-size:10.5px;letter-spacing:.08em;color:#8A8A83;font-weight:700;text-transform:uppercase;margin:16px 0 8px}
.klist .vgrp:first-child{margin-top:2px}
.vtag{flex:none;font-size:10.5px;font-weight:700;border-radius:9px;padding:2px 8px}
.vtag.ampel{display:inline-flex;align-items:center;gap:5px;padding:3px 9px}
.kand2.erl{opacity:.55}
.kand2 .vm2{font-size:11.5px;color:#75756E;margin-top:4px}
.vdet{padding-left:10px}
.vst{font-size:12.5px;color:#3C3C38;line-height:1.55}
.vpfad{font-size:11px;color:#8A8A83;margin-top:6px;word-break:break-all}
.klist{display:flex;flex-direction:column;gap:8px}
/* Ampel — ueberall derselbe Punkt in derselben Farbe. */
.adot{flex:none;width:8px;height:8px;border-radius:50%;display:inline-block}
/* KEINE farbigen Balken am linken Rand (Marcels Ansage 26.08., ausdruecklich: nie wieder).
   Die Dringlichkeit einer Abgabefrist zeigt stattdessen eine Zeitspur am unteren Rand der
   Karte: sie waechst, je naeher die Frist rueckt, und traegt damit mehr Information als
   eine Farbstufe — man sieht nicht nur "dringend", sondern wie weit die Zeit gelaufen ist. */
.fristspur{position:absolute;left:0;right:0;bottom:0;height:3px;background:rgba(28,28,26,.07)}
.fristspur i{display:block;height:100%;border-radius:0 2px 2px 0;transition:width .3s ease}
.card{position:relative;overflow:hidden;flex:none}  /* flex:none ist Pflicht: in der Kartenspalte (flex column) schrumpften die Karten sonst
     unter ihre Inhaltshoehe — bisher lief der Text einfach ueber die Box hinaus, mit der
     abgerundeten Zeitspur (overflow:hidden) waere er abgeschnitten worden. */
/* Legende unter dem Kopf: was rot, orange, gruen heisst. */
.dlegende{flex:none;display:flex;flex-wrap:wrap;align-items:center;gap:8px 18px;margin:-4px 0 14px;
  padding:9px 14px;background:#F4F4F0;border-radius:11px;font-size:11.5px;color:#4F4F49}
.dlegende .lgt{font-size:10px;letter-spacing:.08em;text-transform:uppercase;font-weight:700;color:#8A8A83}
.lgi{display:inline-flex;align-items:center;gap:7px}
.dlegende .lgn{margin-left:auto;color:#8A8A83}
/* Erklaerkasten fuer die Punktzahl. */
.dinfo{background:#F8F8F5;border:1px solid rgba(28,28,26,.07);border-radius:11px;padding:12px 15px;margin-bottom:12px}
.dinfot{font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;font-weight:700;color:#8A8A83;margin-bottom:6px}
.dinfox{font-size:12.5px;line-height:1.6;color:#3C3C38}
.dskala{display:flex;flex-wrap:wrap;gap:8px 16px;margin-top:10px;font-size:11.5px;color:#4F4F49}
/* Listenkopf mit Zaehlpille. */
.slbl.mitzahl{display:flex;align-items:center;gap:9px}
.zpill{font-family:'Space Grotesk',sans-serif;font-size:11px;font-weight:700;letter-spacing:0;
  color:#3C3C38;background:#E8DFC5;border-radius:9px;padding:1px 8px;text-transform:none}
.dnote{margin-top:10px;font-size:11.5px;color:#8A8A83;padding:8px 12px;background:#F4F4F0;border-radius:9px}
.kand2{background:#fff;border:1px solid rgba(28,28,26,.10);border-radius:10px;padding:10px 13px;cursor:pointer;transition:border-color .14s ease,box-shadow .14s ease,transform .14s ease}
.kand2:hover{border-color:rgba(28,28,26,.22);box-shadow:0 4px 14px rgba(28,28,26,.10);transform:translateY(-1px)}
.kand2 .krow{display:flex;gap:9px;align-items:flex-start;min-width:0}
.kscore{flex:none;display:inline-flex;flex-direction:column;align-items:center;justify-content:center;
  width:44px;min-height:34px;border-radius:10px;padding:3px 0;background:#E8F5C4;color:#3C5D1E;line-height:1.05}
.kscore .kn{font-family:'Space Grotesk',sans-serif;font-size:15px;font-weight:700;letter-spacing:-.02em}
.kscore .ke{font-size:8.5px;font-weight:700;letter-spacing:.09em;text-transform:uppercase;opacity:.72}
.kscore.hoch{background:#E1F2BC;color:#33581A}
.kscore.mittel{background:#FBEFDA;color:#7E4F06}
.kscore.niedrig{background:#EFEAE2;color:#77706A}
.kscore.leer{background:#ECECE8;color:#8A8A83}
.kscore.klein{width:auto;min-height:0;padding:2px 8px;font-size:11px;font-weight:700;flex-direction:row}
.kand2 .kt2{flex:1;min-width:0;font-size:13.5px;font-weight:600;line-height:1.35;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.kbtn{flex:none;font-size:11px;font-weight:700;padding:3px 10px;border-radius:9px}
.kbtn.go{background:#E8F5C4;color:#3C5D1E}.kbtn.go:hover{background:#D7EF9E}

/* Karten-Detail (Redesign 26.08., Feedback-Meeting; Korrektur noch am selben Tag nach
   Marcels erstem Blick: Seiten getauscht, Chat-Spalte wirkte bei kurzen Verlaeufen wie
   toter Platz). Die Aufgabe (dinfo) ist die primaere, breitere linke Spalte -- ihr
   Inhalt ist der Grund, warum die Karte ueberhaupt aufgeht. Der Chat (dchat) sitzt
   rechts als schmalere, feste Seitenleiste. Der Kopf spannt oben ueber beide. */
/* 26.08.: KEINE feste Deckelung mehr. Zuerst stand hier min(1600px,98vw) -- auf einem
   breiten Bildschirm blieb das Fenster dadurch bei 1600px stehen, obwohl Platz da war
   (Marcel: "das ganze Fenster muss gleich mit groesser werden"). Jetzt fuellt es den
   Bildschirm; beide Spalten wachsen prozentual mit. */
.drawer{width:97vw;height:94vh;background:#FCFCFB;overflow:hidden;border-radius:20px;box-shadow:0 24px 64px rgba(28,28,26,.25);display:flex;flex-direction:column}
.drawer-kopf{flex:none;padding:20px 30px 14px;border-bottom:1px solid rgba(28,28,26,.09)}
.dbody{flex:1;min-height:0;display:flex}
.dinfo{flex:1;min-width:0;overflow-y:auto;padding-bottom:8px;border-right:1px solid rgba(28,28,26,.09)}
/* Prozentual statt gedeckelt, damit der Chat auf breiten Bildschirmen wirklich
   mitwaechst. Untergrenze 420px, sonst wird er auf kleinen Laptops zu schmal. */
.dchat{width:clamp(420px,36%,760px);flex:none;display:flex;flex-direction:column;min-height:0;background:#F7F7F5}
.dchat-kopf{flex:none;display:flex;align-items:baseline;gap:10px;padding:16px 22px 12px;font-family:'Space Grotesk',sans-serif;font-size:14px;font-weight:700;color:#1C1C1A}
.dchat-hinweis{font-family:'Hanken Grotesk',sans-serif;font-size:11px;font-weight:500;color:#9A9A93}
/* KORREKTUR 26.08. (Marcel, zweiter Blick): justify-content:flex-end verankerte kurze
   Verlaeufe unten -- bei mehr als 1-2 Nachrichten in einer hohen Spalte wanderte die
   Leere dadurch nur nach OBEN (Luecke zwischen Chat-Kopf und erster Nachricht), was wie
   ein Fehler statt wie ein normaler Chat aussah. Echte Vorbilder (Slack, WhatsApp)
   lassen Nachrichten immer von OBEN fliessen; Leerraum UNTEN vor dem Eingabefeld ist
   dort normal und wird nie als kaputt wahrgenommen. overflow-y:auto sorgt weiterhin
   fuer eine echte Scrollbar, sobald der Verlauf die Spalte sprengt. */
.dchat-verlauf{flex:1;min-height:0;overflow-y:auto;padding:4px 22px 14px;display:flex;flex-direction:column}
.dchat-leer{font-size:13px;color:#8A8A83;line-height:1.6;padding:18px 2px;max-width:34ch}
/* Eingabe wie im Claude-Chat: mehrzeiliges Feld, das mit dem Text mitwaechst; der
   Senden-Knopf sitzt unten buendig, damit er bei langem Text nicht mitwandert.
   Die Hoehe setzt JavaScript (hoeheAnpassen), gedeckelt bei 180px -- danach scrollt
   das Feld selbst, statt den Chatverlauf zu verdraengen. */
.dchat-eingabe{flex:none;display:flex;gap:8px;align-items:flex-end;padding:14px 22px 18px;border-top:1px solid rgba(28,28,26,.08);background:#F7F7F5}
.dchat-eingabe textarea{flex:1;padding:10px 13px;border:1px solid rgba(28,28,26,.18);border-radius:10px;background:#fff;font-size:13.5px;line-height:1.5;font-family:inherit;resize:none;overflow-y:auto;max-height:180px;display:block}
.dchat-eingabe textarea:focus{outline:2px solid rgba(124,169,40,.45);outline-offset:-1px;border-color:rgba(124,169,40,.5)}
.dchat-eingabe .btn{padding:10px 18px;flex:none}
/* Chat-Zeilen: eigene Nachricht rechtsbuendig auf Weiss, alle anderen linksbuendig;
   der Agent traegt zusaetzlich einen sandfarbenen Akzentstreifen -- dieselbe Sandfarbe
   wie die Vorschlags-Chips (Migration 115/117), damit "hier handelt der Agent" optisch
   durchgaengig bleibt, ohne eine dritte Akzentfarbe einzufuehren. */
.kom{margin-bottom:14px;max-width:88%}
.kom.kom-agent{max-width:92%}
.kom.kom-mine{align-self:flex-end}
.kom .von{font-size:11px;color:#9A9A93;margin-bottom:4px;display:flex;align-items:center;gap:8px}
.kom .von .edit{margin-left:auto;color:#9A9A93;visibility:hidden}
.kom .von .del{color:#9A9A93;visibility:hidden}
.kom:hover .von .edit,.kom:hover .von .del{visibility:visible}
.kom .von .edit:hover,.kom .von .del:hover{color:#1C1C1A}
.kom .txt{font-size:13.5px;line-height:1.55;background:#fff;border:1px solid rgba(28,28,26,.08);border-radius:12px;padding:10px 13px;box-shadow:0 1px 2px rgba(28,28,26,.04)}
/* Strukturierte Agenten-Antworten (26.08.): Listen und Zwischenueberschriften sollen in
   der schmalen Chat-Spalte auf einen Blick lesbar sein -- enge Abstaende, damit eine
   Aufzaehlung kompakt bleibt und nicht wie ein Formular wirkt. */
.kom .txt p{margin:0 0 7px}
.kom .txt p:last-child{margin-bottom:0}
.kom .txt .txt-kopf{font-weight:700;font-size:12px;letter-spacing:.03em;text-transform:uppercase;color:#75756E;margin:11px 0 5px}
.kom .txt > .txt-kopf:first-child{margin-top:0}
.kom .txt .txt-liste{margin:0 0 7px;padding-left:16px;list-style:none}
.kom .txt .txt-liste:last-child{margin-bottom:0}
.kom .txt .txt-liste li{position:relative;margin-bottom:4px}
.kom .txt .txt-liste li:last-child{margin-bottom:0}
.kom .txt .txt-liste li::before{content:"";position:absolute;left:-12px;top:8px;width:4px;height:4px;border-radius:50%;background:#B8B8AE}
.kom.kom-agent .txt .txt-liste li::before{background:#D8B856}
.kom .txt b{font-weight:600;color:#1C1C1A}
.kom.kom-agent .txt{background:#FEFCF6;border-color:#E8DFC5;border-radius:4px 12px 12px 12px}
/* Lange Antworten falten (Marcel, 27.08.): seit der Agent im Netz recherchieren darf, kommen
   Antworten, die den ganzen Chat zuschuetten. Stehen bleibt der Anfang -- also das Ergebnis --,
   der Rest klappt auf Klick auf. Kein Balken, nur ein Auslauf in die jeweilige Blasenfarbe. */
.kom .txt.komfold{position:relative;max-height:184px;overflow:hidden}
.kom .txt.komfold::after{content:"";position:absolute;left:0;right:0;bottom:0;height:52px;pointer-events:none;background:linear-gradient(rgba(255,255,255,0),#fff)}
.kom.kom-agent .txt.komfold::after{background:linear-gradient(rgba(254,252,246,0),#FEFCF6)}
.kom .txt.komfold.komauf{max-height:none;overflow:visible}
.kom .txt.komfold.komauf::after{display:none}
.kom .mehrbtn{margin-top:5px;font-size:11.5px;font-weight:600;color:#75756E;padding:2px 0}
.kom .mehrbtn:hover{color:#1C1C1A}
.kom.kom-agent .von{font-weight:600;color:#8A6D1E}
/* Vorschlagszeile und Tipp-Anzeige sitzen im selben Chatfluss -- volle Breite der Spalte. */
.dchat-verlauf .vorschlagzeile,.dchat-verlauf .agenttippt{max-width:92%}

.kaltitel{font-family:'Space Grotesk',sans-serif;font-size:16px;font-weight:700;min-width:170px;text-align:center}
.kalnav{font-size:17px;color:#55554F;padding:2px 10px;border-radius:8px}
.kalnav:hover{background:rgba(28,28,26,.07)}
.kalgrid{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
.kalwt{font-size:10.5px;font-weight:700;color:#8A8A83;padding:2px 8px}
.kaltag{background:#fff;border-radius:11px;min-height:96px;padding:6px 7px;font-size:11px;box-shadow:0 1px 2px rgba(28,28,26,.05)}

.kaltag.heute{outline:2px solid #1C1C1A;outline-offset:-2px}

.kaltag.dragover{outline:2px solid #A3D542;outline-offset:-2px}
.kalfix{background:#F7DDD6;border-radius:6px;padding:3px 7px;margin-top:5px;font-size:10px;font-weight:700;color:#8C2F1D;line-height:1.3;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.kalpille{background:rgba(28,28,26,.06);border-radius:6px;padding:3px 7px;margin-top:5px;font-size:10.5px;line-height:1.3;cursor:pointer;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.kalpille:hover{background:rgba(28,28,26,.11)}
.kalpille.zu{background:#FBF3E2;border-radius:6px}
.kalpille.erl{opacity:.5;text-decoration:line-through}
.kalhint{font-size:11.5px;color:#8A8A83;padding:10px 2px}

/* ---- Mein Radar (Startansicht): alles Offene einer Person, nach Bereich ---- */
#radar-root{flex:1;min-height:0;overflow:auto;padding:2px 28px 28px}
.rkpis{display:grid;grid-template-columns:repeat(auto-fill,minmax(168px,220px));gap:10px;padding:2px 0 16px}
/* Kennzahlen nach Datum-Muster (agentic-os/app/dashboard.css, .kpi-strip/.kpi):
   weisse randlose Karte, Label oben, 31px Space-Grotesk-Zahl, Unterzeile fuer den
   Bezug. Status steckt AUSSCHLIESSLICH in der Zahl -- keine Farbflaechen. */
.rkpi{background:#FFF;border:none;border-radius:18px;padding:14px 16px 13px;min-width:168px;box-shadow:0 1px 2px rgba(22,19,15,.05);display:flex;flex-direction:column;min-width:0;transition:box-shadow .15s ease}
.rkpi .l{font-size:11px;color:#6B6B66;font-weight:600;margin-bottom:10px;line-height:1.3}
.rkpi .z{font-family:'Space Grotesk',sans-serif;font-size:31px;font-weight:600;color:#16130F;line-height:.9;letter-spacing:-.02em}
.rkpi .s{font-size:10.5px;color:#8F8F8B;margin-top:7px;line-height:1.35}
.rkpi.warn .z{color:#D9701E}
.rkpi.alert .z{color:#C93A2E}
.rkpi.klick{cursor:pointer}
.rkpi.klick:hover{box-shadow:0 10px 26px rgba(22,19,15,.11)}
.rgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(360px,1fr));gap:16px;align-items:start}
.rbereich{background:#FFF;border:none;border-radius:18px;padding:13px 16px 11px;box-shadow:0 1px 2px rgba(22,19,15,.05)}
.rbh{display:flex;align-items:center;gap:8px;padding:0 2px 9px;cursor:pointer}
.rbh:hover .rbt{text-decoration:underline}
.rbh .pdot{width:10px;height:10px;border-radius:3px;flex:none}
.rbt{font-size:13px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rbart{font-size:10.5px;color:#8A8A83;white-space:nowrap}
.rbn{margin-left:auto;font-size:11.5px;font-weight:600;color:#75756E;background:rgba(28,28,26,.06);border-radius:10px;padding:1px 8px;flex:none}
.rz{padding:7px 8px;border-radius:8px;cursor:pointer;border-top:1px solid rgba(28,28,26,.06)}
.rz:hover{background:rgba(28,28,26,.045)}
.rzt{font-size:12.5px;line-height:1.35}
.rzm{font-size:11px;color:#8A8A83;margin-top:2px}
.rchip{font-size:10px;font-weight:700;padding:2px 7px;border-radius:9px;margin-right:6px;white-space:nowrap}
.rchip.rueck{background:#FDEFE2;color:#D9701E}
.rchip.zu{background:#FDEFE2;color:#D9701E}

.rchip.frist.ruhig{background:rgba(28,28,26,.07);color:#55554F}
.rchip.komm{background:#E8DFC5;color:#5C4A16}
.rbneu{margin-left:auto;font-size:10.5px;font-weight:700;color:#5C4A16;background:#E8DFC5;border-radius:9px;padding:1px 8px;white-space:nowrap;flex:none}
.rbneu + .rbn{margin-left:6px}
.rmehr{font-size:11.5px;color:#75756E;padding:7px 8px;border-radius:8px;width:100%;text-align:left}
.rmehr:hover{background:rgba(28,28,26,.045);color:#1C1C1A}
.rleer{background:#fff;border-radius:16px;padding:26px 22px;font-size:13px;color:#75756E;box-shadow:0 1px 2px rgba(28,28,26,.06)}
.rleer b{display:block;font-family:'Space Grotesk',sans-serif;font-size:15px;color:#1C1C1A;margin-bottom:5px}
.rkopf{display:flex;align-items:flex-start;gap:14px;flex-wrap:wrap}
.rkopf .rkpis{flex:1}
.rwahlbtn{background:#1C1C1A;color:#F7F7F5;font-size:12.5px;font-weight:600;padding:8px 15px;border-radius:18px;margin:14px 0 0;white-space:nowrap}
.rwahlbtn:hover{background:#33332F}
.rgrid.fest{grid-template-columns:repeat(auto-fill,minmax(440px,1fr));margin-bottom:16px}
.rbereich.fest .rbt{letter-spacing:-.01em}
.rbereich.fest .rbt{font-family:'Space Grotesk',sans-serif;font-size:14px}
.rbh.klick{cursor:pointer}
.rbh:not(.klick){cursor:default}
.rzleer{font-size:12px;color:#8A8A83;padding:8px 8px 12px}
