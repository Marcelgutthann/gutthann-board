<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="only light">
<title>Gutthann Board</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{color-scheme:only light}
body{background:#F3F3F1;color:#1C1C1A;font-family:'Hanken Grotesk',sans-serif;height:100vh;overflow:hidden}
input,button,textarea,select{font-family:'Hanken Grotesk',sans-serif;font-size:13px;color:#1C1C1A}
button{cursor:pointer;background:none;border:none}
*{scrollbar-width:thin;scrollbar-color:rgba(28,28,26,.25) transparent}
/* Redesign 10.08.: Dauer-Animationen (Blinken/Pulsieren) sind raus — Ruhe statt Unruhe.
   Agent-Aktivitaet zeigt ein statischer Ring an der Karte. */
#app{display:flex;height:100vh;overflow:hidden}

.sidebar{width:252px;flex:none;background:#FBFBFA;border-right:1px solid rgba(28,28,26,.10);display:flex;flex-direction:column;overflow-y:auto}
.brand{padding:18px 16px 14px;border-bottom:1px solid rgba(28,28,26,.08)}
.brand h1{font-family:'Space Grotesk',sans-serif;font-size:15px;font-weight:700}
.brand .sub{font-size:11.5px;color:#75756E;margin-top:3px;display:flex;align-items:center;gap:6px}
.brand .sub .dot{width:7px;height:7px;border-radius:50%;background:#7CA928}
.sect{padding:14px 10px 4px}
.sect .lbl{font-size:10.5px;letter-spacing:.09em;color:#8A8A83;font-weight:600;padding:0 8px 6px;text-transform:uppercase}
.row{display:flex;align-items:center;gap:8px;padding:7px 8px;border-radius:7px;cursor:pointer;font-size:13px;color:#33332F;user-select:none}
.row:hover{background:rgba(28,28,26,.05)}
.row.active{background:#E8DFC5;font-weight:600;color:#1C1C1A}
.row .pdot{width:10px;height:10px;border-radius:3px;flex:none}
.row .badge{margin-left:auto;background:#E29A2E;color:#231602;font-size:10.5px;font-weight:700;min-width:17px;height:17px;border-radius:9px;display:flex;align-items:center;justify-content:center;padding:0 5px}
.row .pin{margin-left:auto;color:#9A9A93;font-size:12px;visibility:hidden;background:none}
.row:hover .pin{visibility:visible}
.row.addrow{color:#75756E}
.row.addrow:hover{color:#1C1C1A}

.main{flex:1;display:flex;flex-direction:column;min-width:0}
.topbar{padding:16px 22px 10px;display:flex;align-items:center;gap:12px;flex:none;flex-wrap:wrap}
.topbar h2{font-family:'Space Grotesk',sans-serif;font-size:21px;font-weight:700}
.topbar .scope{font-size:12px;color:#75756E}
.alertbtn{background:#E29A2E;color:#231602;font-size:12.5px;font-weight:600;padding:7px 14px;border-radius:18px;display:flex;align-items:center;gap:7px}
.callbtn{margin-left:auto;background:#1C1C1A;color:#F7F7F5;font-size:12.5px;font-weight:600;padding:7px 14px;border-radius:18px;white-space:nowrap}
.callbtn:hover{background:#33332F}.callbtn:disabled{opacity:.55;cursor:default}
.boardwrap{flex:1;overflow-x:auto;overflow-y:hidden;padding:12px 28px 24px;display:flex;gap:20px;align-items:flex-start}
.col{width:352px;flex:none;display:flex;flex-direction:column;background:rgba(28,28,26,.035);border:none;border-radius:16px;max-height:100%}
.col.dragover{outline:2px solid #A3D542;outline-offset:-2px}
.colhead{padding:14px 14px 10px 16px;display:flex;align-items:center;gap:7px;flex:none}
.colhead .name{font-size:13px;font-weight:600;letter-spacing:.01em}
.colhead .cnt{font-size:11.5px;font-weight:600;color:#75756E;background:rgba(28,28,26,.06);border-radius:10px;padding:1px 8px}
.colhead .roledot{width:7px;height:7px;border-radius:50%;background:#A3D542}
.colhead .menu{margin-left:auto;color:#8A8A83;padding:2px 6px;border-radius:5px;opacity:0;transition:opacity .12s ease}
.col:hover .colhead .menu{opacity:1}
.colhead .menu:hover{background:rgba(28,28,26,.07)}
.colhead .autochip{font-size:10px;font-weight:700;padding:2px 7px;border-radius:9px;background:#E8F5C4;color:#3E5312;cursor:pointer;white-space:nowrap}
.colhead .autochip:hover{background:#DCEFA8}
.cards{overflow-y:auto;padding:6px 10px;display:flex;flex-direction:column;gap:10px;min-height:30px}
.card{background:#FFFFFF;border:none;border-radius:12px;padding:12px 14px;cursor:pointer;box-shadow:0 1px 2px rgba(28,28,26,.06),0 2px 8px rgba(28,28,26,.05);transition:box-shadow .15s ease,transform .15s ease}
.card:hover{box-shadow:0 4px 16px rgba(28,28,26,.10);transform:translateY(-1px)}
.card.aura{box-shadow:0 0 0 2px rgba(163,213,66,.45),0 2px 8px rgba(28,28,26,.05)}
.card.rf{background:#FBF3E2;box-shadow:0 0 0 1.5px #E29A2E,0 2px 8px rgba(28,28,26,.05)}
.card .chip{display:inline-flex;align-items:center;gap:5px;font-size:10.5px;font-weight:600;padding:2px 8px;border-radius:9px;margin-bottom:6px}
.card .chip .cdot{width:6px;height:6px;border-radius:50%}
.card .t{font-size:15px;font-weight:600;line-height:1.35;letter-spacing:-.01em;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.card .meta{display:flex;align-items:center;gap:8px;margin-top:8px;font-size:12px;color:#75756E;flex-wrap:nowrap;overflow:hidden;min-width:0}
.card .meta>span{flex:none}
.card .meta .due.urgent{color:#A66A12;font-weight:600}
.card .meta .proj{margin-left:auto;font-weight:600;flex:0 1 auto;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.card .vgvrow{display:flex;align-items:center;gap:7px;margin-top:7px;flex-wrap:nowrap;overflow:hidden}
.card .vchip{font-size:10.5px;font-weight:700;letter-spacing:.03em;padding:2px 9px;border-radius:9px}
.card .vfrist{font-size:11.5px;color:#75756E}
.card .vfrist.urgent{color:#A66A12;font-weight:700}
.vgvban{border-radius:10px;padding:10px 14px;margin-bottom:10px}
.vgvkv{display:grid;grid-template-columns:auto 1fr;gap:3px 14px;font-size:12.5px}
.vgvkv .k{color:#75756E;white-space:nowrap}
.vgvkv .w{color:#1C1C1A}
.vgvdat{max-height:180px;overflow:auto;background:#F6F6F3;border-radius:9px;padding:8px 12px;font-size:12px;line-height:1.7;color:#3C3C38}
a.vgvlnk{text-decoration:none;display:inline-flex;align-items:center;font-size:12px;padding:5px 11px}
.dashbtn{background:#E8DFC5;color:#1C1C1A;font-size:12.5px;font-weight:600;padding:7px 14px;border-radius:18px;white-space:nowrap}
.dashbtn:hover{background:#DFD2AC}
.dashbox{width:96vw;max-width:1620px;height:92vh;display:flex;flex-direction:column;background:#FCFCFB;border-radius:16px;box-shadow:0 18px 48px rgba(28,28,26,.28);padding:18px 24px}
.dashbox .scope{font-size:12px;color:#75756E}
.dkopf{display:flex;align-items:baseline;gap:14px;margin-bottom:14px;flex:none}
.dkopf h2{font-family:'Space Grotesk',sans-serif;font-size:19px;font-weight:700}
.dclose{margin-left:auto;font-size:17px;color:#75756E;padding:2px 8px}
.dgrid{flex:1;min-height:0;display:grid;grid-template-columns:minmax(0,58fr) minmax(0,42fr);gap:0 26px}
.dcol{min-height:0;overflow-y:auto;padding-right:6px}
@media(max-width:1020px){.dashbox{height:auto;max-height:92vh;overflow-y:auto}.dgrid{display:block}}
.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:20px}
.kpi{background:#fff;border:1px solid rgba(28,28,26,.09);border-radius:12px;padding:11px 14px 9px}
.kpi .w{font-family:'Space Grotesk',sans-serif;font-size:21px;font-weight:700;line-height:1.1}
.kpi.warn .w{color:#B4540A}
.kpi .l{font-size:10px;letter-spacing:.07em;color:#8A8A83;font-weight:700;text-transform:uppercase;margin-top:3px}
.kpi .s{font-size:11px;color:#75756E;margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dlane{margin-bottom:22px}
.dlane .slbl{font-size:10.5px;letter-spacing:.08em;color:#8A8A83;font-weight:700;text-transform:uppercase;margin-bottom:9px}
.dleer{font-size:12.5px;color:#75756E;background:#F6F6F3;border-radius:9px;padding:10px 14px}
.drow{display:grid;grid-template-columns:200px 1fr;gap:12px;align-items:center;margin-bottom:6px}
.dlbl{font-size:12.5px;line-height:1.3;overflow:hidden}
.dlbl b{display:block;white-space:nowrap;text-overflow:ellipsis;overflow:hidden;font-weight:600}
.dlbl .dsub{font-size:11px;color:#8A8A83}
.dtrack{position:relative;height:22px;background:#EFEFEB;border-radius:6px}
.dtrack.kopf{background:none;height:14px}
.dtick{position:absolute;top:0;font-size:10px;color:#9A9A93;transform:translateX(-50%)}
.dbar{position:absolute;left:0;top:6px;height:10px;border-radius:5px;background:#C9DFA0}
.dbar.knapp{background:#F3D9A8}.dbar.rot{background:#EFB9A8}.dbar.vorbei{background:#DDDDD7}
.ddot{position:absolute;top:5px;width:12px;height:12px;border-radius:50%;background:#5FA132;transform:translateX(-50%);border:2px solid #FCFCFB}
.ddot.knapp{background:#D08427}.ddot.rot{background:#C2543D}.ddot.vorbei{background:#9A9A93}
.dend{position:absolute;top:3px;font-size:11px;font-weight:700;color:#3C5D1E;transform:translateX(10px);white-space:nowrap}
.dend.knapp{color:#8A5606}.dend.rot{color:#B4432E}.dend.vorbei{color:#8A8A83}
.dtabs{display:flex;gap:3px;background:#EFEFEB;border-radius:20px;padding:3px}
.dtab{font-size:12.5px;font-weight:600;color:#75756E;padding:6px 14px;border-radius:17px;display:flex;align-items:center;gap:7px;white-space:nowrap}
.dtab:hover{color:#1C1C1A}
.dtab.an{background:#FCFCFB;color:#1C1C1A;box-shadow:0 1px 3px rgba(28,28,26,.12)}
.dtab .n{font-size:11px;font-weight:700;color:#8A8A83;background:#E4E4DE;border-radius:8px;padding:0 6px}
.dtab.an .n{background:#E8DFC5;color:#3C3C38}
.vgrp{font-size:10.5px;letter-spacing:.08em;color:#8A8A83;font-weight:700;text-transform:uppercase;margin:16px 0 8px}
.klist .vgrp:first-child{margin-top:2px}
.vtag{flex:none;font-size:10.5px;font-weight:700;border-radius:9px;padding:2px 8px}
.kand2.erl{opacity:.55}
.kand2 .vm2{font-size:11.5px;color:#75756E;margin-top:4px}
.vdet{padding-left:10px}
.vst{font-size:12.5px;color:#3C3C38;line-height:1.55}
.vpfad{font-size:11px;color:#8A8A83;margin-top:6px;word-break:break-all}
.klist{display:flex;flex-direction:column;gap:7px}
.kand2{background:#fff;border:1px solid rgba(28,28,26,.10);border-radius:10px;padding:9px 12px;cursor:pointer}
.kand2:hover{border-color:rgba(28,28,26,.25)}
.kand2 .krow{display:flex;gap:9px;align-items:center;min-width:0}
.kscore{flex:none;font-size:11px;font-weight:700;color:#3C5D1E;background:#E8F5C4;border-radius:9px;padding:1px 7px;min-width:26px;text-align:center}
.kscore.leer{background:#ECECE8;color:#8A8A83}
.kand2 .kt2{flex:1;font-size:13px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.kbtn{flex:none;font-size:11px;font-weight:700;padding:3px 10px;border-radius:9px}
.kbtn.go{background:#E8F5C4;color:#3C5D1E}.kbtn.go:hover{background:#D7EF9E}
.kbtn.nogo{background:#ECECE8;color:#75756E}.kbtn.nogo:hover{background:#DDDDD7;color:#1C1C1A}
.kand2 .km2{font-size:11.5px;color:#75756E;margin-top:4px;padding-left:35px}
.kdet{margin-top:7px;padding:8px 10px 8px 35px;background:#F8F8F5;border-radius:8px}
.kref{font-size:12px;color:#3C5D1E}
.kbeg{font-size:12.5px;color:#3C3C38;margin-top:4px;line-height:1.45}
.kandhin{background:#F6F6F3;border-radius:10px;padding:10px 14px;font-size:12.5px;color:#55554F}
.kandhin.go{background:#E8F5C4;color:#3C5D1E}
.card .avs{display:flex;margin-left:2px}
.card .av{width:17px;height:17px;border-radius:50%;color:#fff;font-size:8.5px;font-weight:700;display:flex;align-items:center;justify-content:center;margin-left:-4px;border:1.5px solid #FCFCFB}
.addcard{padding:8px 12px;color:#75756E;font-size:12.5px;text-align:left;border-radius:8px;margin:0 8px 8px}
.addcard:hover{background:rgba(28,28,26,.05);color:#1C1C1A}
.addcol{width:220px;flex:none;border:1.5px dashed rgba(28,28,26,.22);border-radius:12px;display:flex;align-items:center;justify-content:center;color:#75756E;font-size:13px;padding:14px;cursor:pointer;background:none}
.addcol:hover{color:#1C1C1A;border-color:rgba(28,28,26,.4)}
.newinput{margin:0 8px 8px;padding:8px 10px;border:1px solid rgba(28,28,26,.2);border-radius:8px;background:#fff;width:calc(100% - 16px)}

.overlay{position:fixed;inset:0;background:rgba(28,28,26,.32);display:flex;justify-content:center;align-items:center;padding:4vh 0;z-index:50}
/* Karten-Detail: grosses zentriertes Sheet statt schmalem Rechts-Drawer (Redesign 10.08.). */
.drawer{width:min(760px,94vw);max-height:88vh;background:#FCFCFB;height:auto;overflow-y:auto;border-radius:20px;box-shadow:0 24px 64px rgba(28,28,26,.25)}
.modalbox{width:470px;max-width:92vw;background:#FCFCFB;border-radius:14px;box-shadow:0 18px 48px rgba(28,28,26,.28);padding:18px 20px;max-height:88vh;overflow-y:auto}
.modalbox .slbl{font-size:10.5px;letter-spacing:.08em;color:#8A8A83;font-weight:700;text-transform:uppercase;margin-bottom:7px}
.autota{width:100%;min-height:96px;padding:8px 10px;border:1px solid rgba(28,28,26,.2);border-radius:8px;background:#fff;font-size:13px;font-family:inherit;resize:vertical}
.autosel{width:100%;padding:7px 10px;border:1px solid rgba(28,28,26,.2);border-radius:8px;background:#fff;font-size:13px}
.dsec{padding:14px 28px;border-bottom:none}
.dsec:first-child{padding-top:22px}
.dsec:last-child{padding-bottom:24px}
.dsec .slbl{font-size:10.5px;letter-spacing:.08em;color:#8A8A83;font-weight:700;text-transform:uppercase;margin-bottom:9px}
.dhead .t{font-family:'Space Grotesk',sans-serif;font-size:20px;font-weight:700;line-height:1.3;margin:8px 0 8px;letter-spacing:-.01em}
.dhead .meta{font-size:12px;color:#75756E;display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.metabtn{font-size:12px;color:#75756E;padding:3px 10px;border:1px solid rgba(28,28,26,.14);border-radius:8px;background:#fff;cursor:pointer}
.metabtn:hover{color:#1C1C1A;border-color:rgba(28,28,26,.3)}
.btn.gefahr{color:#B4432E;border-color:rgba(180,67,46,.4)}
.btn.gefahr:hover{background:#F9ECE9}
.rfsec{background:#FBF3E2}
.rfsec .slbl{color:#8A5606}
.rfsec .frage{font-size:13px;color:#231602;margin:10px 0 6px;line-height:1.45}
.rfsec input{width:100%;padding:8px 10px;border:1px solid rgba(138,86,6,.35);border-radius:8px;background:#fff}
.rfsec .beantwortet{font-size:12px;color:#5A6E1E;margin:4px 0 0}
.btn{background:#1C1C1A;color:#F7F7F5;font-weight:600;font-size:12.5px;padding:8px 15px;border-radius:8px}
.btn:hover{background:#33332F}
.btn.lime{background:#D3F462;color:#1C1C1A}
.btn.ghost{background:none;border:1px solid rgba(28,28,26,.25);color:#33332F}
.btn.warn{background:#E29A2E;color:#231602}
.pre{white-space:pre-wrap;font-size:13px;line-height:1.55;color:#33332F}
.sub{display:flex;align-items:center;gap:8px;padding:5px 0;font-size:13px}
.sub input[type=checkbox]{accent-color:#5A6E1E}
.sub .del{margin-left:auto;color:#9A9A93;visibility:hidden}
.sub:hover .del{visibility:visible}
.pill{display:inline-flex;align-items:center;gap:5px;background:rgba(28,28,26,.07);border-radius:12px;padding:3px 10px;font-size:12px;margin:0 6px 6px 0}
.kom{margin-bottom:10px}
.kom .von{font-size:11.5px;color:#75756E;margin-bottom:2px}
.kom .txt{font-size:13px;background:#fff;border:1px solid rgba(28,28,26,.08);border-radius:8px;padding:7px 10px}
.vrow{display:flex;gap:10px;font-size:12.5px;color:#75756E;padding:3px 0}
.inline-add{display:flex;gap:7px;margin-top:8px}
.inline-add input{flex:1;padding:7px 10px;border:1px solid rgba(28,28,26,.18);border-radius:8px;background:#fff}
.ctx{position:fixed;background:#fff;border:1px solid rgba(28,28,26,.14);border-radius:10px;box-shadow:0 8px 28px rgba(28,28,26,.16);z-index:99;min-width:210px;padding:5px;max-height:60vh;overflow-y:auto}
.ctx button{display:block;width:100%;text-align:left;padding:8px 12px;border-radius:7px;font-size:13px}
.ctx button:hover{background:rgba(28,28,26,.06)}
.ctx button.danger{color:#B4432E}
.ctx .note{padding:6px 12px;font-size:11.5px;color:#9A9A93}

#login{position:fixed;inset:0;background:#E8E8E6;display:flex;align-items:center;justify-content:center;z-index:100}
.logincard{background:#FCFCFB;border:1px solid rgba(28,28,26,.12);border-radius:14px;padding:34px 36px;width:360px}
.logincard h1{font-family:'Space Grotesk',sans-serif;font-size:19px;margin-bottom:4px}
.logincard .s{font-size:12.5px;color:#75756E;margin-bottom:20px}
.logincard input{width:100%;padding:10px 12px;border:1px solid rgba(28,28,26,.2);border-radius:9px;background:#fff;margin-bottom:10px;font-size:14px}
.logincard .err{color:#B4432E;font-size:12.5px;margin:4px 0 8px;min-height:16px}
.logincard .btn{width:100%;padding:11px;font-size:14px}
.hidden{display:none!important}
.empty{color:#8A8A83;font-size:12.5px}
/* ---- Proaktiver Kollege (Loop B/D/E) ---- */
.taskbar{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.tchip{display:flex;align-items:center;gap:6px;background:#FCFCFB;border:1px solid rgba(28,28,26,.12);border-radius:14px;padding:4px 11px;font-size:11px;font-weight:600;color:#3C3C38;box-shadow:0 1px 3px rgba(28,28,26,.07);cursor:pointer;max-width:300px;overflow:hidden;white-space:nowrap}
.tchip:hover{border-color:rgba(28,28,26,.3)}
.tchip .tdot{width:7px;height:7px;border-radius:50%;background:#7CA928;flex:none}
.tchip small{font-weight:500;color:#8A8A83}
.tchip.warte{color:#8A8A83;cursor:default}
.inarbeit{flex-basis:100%;display:flex;align-items:center;gap:8px;font-size:11.5px;color:#55554F;flex-wrap:wrap;padding-top:2px}
.inarbeit .who{display:flex;align-items:center;gap:6px;background:rgba(28,28,26,.05);border-radius:12px;padding:3px 10px;white-space:nowrap}
.inarbeit .av{width:17px;height:17px;border-radius:50%;color:#fff;font-size:8px;font-weight:700;display:inline-flex;align-items:center;justify-content:center}
.chip.zu{background:#E8DFC5;color:#5A4A12}
.card .wofuer{font-size:11.5px;background:#FBF6E9;border-left:3px solid #D8B856;border-radius:0 7px 7px 0;padding:6px 9px;margin-top:7px;color:#4A4438;line-height:1.4;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.card .wofuer b{color:#1C1C1A}
.zielbild{background:#FBF6E9;border:1px solid #E5D9B4;border-radius:12px;padding:12px 16px;font-size:13.5px;line-height:1.5}
#kal-root{flex:1;min-height:0;overflow:auto;padding:6px 28px 24px}
.kalkopf{display:flex;align-items:center;gap:12px;padding:6px 2px 12px}
.kaltitel{font-family:'Space Grotesk',sans-serif;font-size:16px;font-weight:700;min-width:170px;text-align:center}
.kalnav{font-size:17px;color:#55554F;padding:2px 10px;border-radius:8px}
.kalnav:hover{background:rgba(28,28,26,.07)}
.kalgrid{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
.kalwt{font-size:10.5px;font-weight:700;color:#8A8A83;padding:2px 8px}
.kaltag{background:#fff;border-radius:11px;min-height:96px;padding:6px 7px;font-size:11px;box-shadow:0 1px 2px rgba(28,28,26,.05)}
.kaltag b{font-size:11.5px}
.kaltag.we{background:#F7F7F4;color:#8A8A83}
.kaltag.heute{outline:2px solid #1C1C1A;outline-offset:-2px}
