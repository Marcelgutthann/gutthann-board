<!--
  Druckvorlage Beteiligtenliste — nachgebaut aus dem Buero-Ausdruck
  "Projektbeteiligte_2026-07-20 inkl Logo.pdf" (3901-23 Hemau).

  Alle Masse sind aus dem Original gemessen (A4 595x842 pt):
    Rand links/rechts  42,5 pt        = 15 mm
    Satzbreite         510  pt        = 180 mm
    Schrift            Verdana 9 pt, Kontaktspalte 8 pt
    Gruppenbalken      volle Satzbreite, Fuellung #e3e3e3, Hoehe 23 pt
    Text im Balken     7,5 pt eingerueckt, fett
    Kontaktspalte      beginnt bei 322 pt = 54 % der Satzbreite
    Trennlinie         0,5 pt #b3b3b3, eingerueckt auf 50 pt
    Kopfzeile Folgeseiten: Projektname + Linie
    Fusszeile: "Erstellt am ... | Seite x von y", rechtsbuendig

  PLATZHALTER, die dashboard.js ersetzt:
    {{PROJEKT}}   Projektname
    {{TITEL}}     Ueberschrift der Liste (mit Datum)
    {{DATUM}}     Erstellungsdatum, z. B. 20.07.2026
    {{LOGO}}      data:-URI des Buero-Logos
    {{INHALT}}    die erzeugten Gruppen-, Firmen- und Personenbloecke
-->
<style>
/* Hochformat, Satzspiegel randnah: 210 x 297 mm bei 10 mm Rand = 190 mm
   nutzbare Breite. Die Balken laufen ueber die volle Breite, die Kontaktspalte
   bekommt den groesseren Anteil, damit lange Mailadressen in eine Zeile passen. */
@page { size: A4 portrait; margin: 10mm 10mm 16mm; }
html, body { margin: 0; padding: 0; }
body {
  font-family: Verdana, Geneva, sans-serif;
  font-size: 9pt;
  line-height: 1.45;
  color: #000;
}
/* WICHTIG: Browser drucken Hintergrundfarben standardmaessig NICHT ("Hintergrund-
   grafiken" ist im Druckdialog per Voreinstellung aus). Ohne diese Zeilen bleiben
   die grauen Balken im PDF unsichtbar. Gilt fuer Chrome/Edge/Safari/Firefox. */
* { -webkit-print-color-adjust: exact !important; print-color-adjust: exact !important; }

/* ---- Bedienhinweis: nur am Bildschirm, nie im Ausdruck ---------------- */
.hinweis {
  background: #fff7ed; border: 1px solid #f0b866; border-radius: 4px;
  padding: 8px 12px; margin-bottom: 8mm; font-size: 8.5pt; line-height: 1.5; color: #7a4b06;
}
@media print { .hinweis { display: none !important; } }

/* ---- Kopf der ersten Seite ------------------------------------------- */
.kopf { display: flex; align-items: flex-start; gap: 10mm; margin-bottom: 10mm; }
.kopf .tx { flex: 1; min-width: 0; }
.kopf h1 { font-size: 11pt; font-weight: bold; margin: 0 0 6mm; }
.kopf .zeile { display: flex; gap: 6mm; font-size: 9pt; }
.kopf .zeile .lab { width: 26mm; flex-shrink: 0; }
.kopf .logo { width: 33mm; flex-shrink: 0; }
.kopf .logo img { width: 100%; height: auto; display: block; }
h2.titel { font-size: 10pt; font-weight: bold; margin: 0 0 2.5mm; }
.titel-linie { border-bottom: .75pt solid #a6a6a6; margin-bottom: 7mm; }

/* ---- Gruppen- und Firmenbalken --------------------------------------- */
/* Volle Satzbreite, hellgrau. Im Original tragen Gruppen UND Firmenpositionen
   denselben Balken -- nur die Einrueckung des Textes unterscheidet sie. */
.balken {
  background: #e3e3e3;
  font-weight: bold;
  padding: 2.2pt 0 2.2pt 7.5pt;
  margin: 5mm 0 2mm;
  break-after: avoid;
  page-break-after: avoid;
  break-inside: avoid;
  /* Bewusst ohne Rahmen: die reine Flaeche reicht. Damit haengt die Sichtbarkeit
     allein an "Hintergrundgrafiken" im Druckdialog -- darauf weist der Hinweis
     ueber der Liste hin. */
}
.balken .nr { font-weight: bold; margin-right: 3mm; }
.balken.e1 { margin-top: 4mm; }
.balken.e2 { margin-top: 3mm; }

/* ---- Eintragssatz: links Anschrift, rechts Kontakte ------------------- */
/* Jeder Eintrag ist eine eigene einzeilige Tabelle. Grund: Chrome schneidet
   Flex- und Block-Container beim Seitenumbruch mitten durch, obwohl
   break-inside:avoid gesetzt ist -- eine Tabellenzeile dagegen wird zuverlaessig
   komplett auf die naechste Seite geschoben. */
table.satz {
  width: 100%;
  border-collapse: collapse;
  break-inside: avoid;
  page-break-inside: avoid;
}
table.satz > tbody > tr > td { padding: 2mm 0 2.5mm; vertical-align: top; }
table.satz > tbody > tr > td.li { padding-left: 7.5pt; }
table.satz + table.satz > tbody > tr > td { border-top: .75pt solid #a6a6a6; }
/* Im Querformat reichen 34 % fuer Firma und Anschrift. Der Satz bekommt eine
   Maximalbreite, sonst stehen die Kontaktwerte einsam am rechten Blattrand. */
table.satz > tbody > tr > td.li { width: 40%; padding-right: 5mm; }
.satz .kopfzeile { margin-bottom: .4mm; }
.satz .kopfzeile .nr { margin-right: 3mm; }
.satz .firma { font-weight: bold; }
.satz .funktion { color: #333; }
.satz .offen { color: #7a6212; font-style: italic; }

/* ---- Kontaktspalte ---------------------------------------------------- */
/* Feste Spaltenbreiten, sonst rutscht der Wert je nach Textlaenge hin und her. */
table.kon { border-collapse: collapse; font-size: 8pt; width: 100%; table-layout: fixed; }
table.kon td { padding: 0 1.5mm .4mm 0; vertical-align: top; }
td.ki { width: 5.5mm; }
td.kk { width: 14mm; white-space: nowrap; color: #000; }
td.kw { word-break: break-word; }
/* Symbole als Vektor: Unicode-Telefone und -Faxe sehen je nach installierter
   Schrift voellig anders aus (mal Emoji, mal durchgestrichenes Telefon). */
td.ki svg { width: 3.2mm; height: 3.2mm; display: block; margin-top: .35mm; }

/* ---- Fusszeile -------------------------------------------------------- */
/* Ohne Seitenzahl-Zaehler des Browsers: der Druckdialog blendet Kopf- und
   Fusszeilen selbst ein, wenn gewuenscht. Hier steht nur das Erstelldatum. */
.fuss {
  position: fixed; bottom: 6mm; left: 0; right: 0;
  border-top: .75pt solid #a6a6a6;
  padding-top: 1.5mm;
  font-size: 8pt; text-align: right;
}
</style>

<!-- Nur am Bildschirm sichtbar, wird nie mitgedruckt: die Checkbox
     "Hintergrundgrafiken" im Druckdialog sticht jedes CSS. Ohne sie bleiben
     die grauen Balken leer. -->
<div class="hinweis">
  <b>Vor dem Speichern:</b> im Druckdialog unter „Weitere Einstellungen“ den Haken bei
  <b>Hintergrundgrafiken</b> setzen — sonst bleiben die grauen Balken weiß.
  Ziel „Als PDF speichern“, Ränder „Standard“, Kopf- und Fußzeilen aus.
</div>

<div class="kopf">
  <div class="tx">
    <h1>Beteiligtenliste</h1>
    <div class="zeile"><span class="lab">Projekt:</span><span>{{PROJEKT}}</span></div>
  </div>
  <div class="logo"><img src="{{LOGO}}" alt=""></div>
</div>

<h2 class="titel">{{TITEL}}</h2>
<div class="titel-linie"></div>

{{INHALT}}

<div class="fuss">Erstellt am {{DATUM}}</div>
